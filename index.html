<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Meta tags for responsive design and character encoding -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DoofPlus - Pharmaceutical Workspace</title>
  <link rel="stylesheet" href="public/assets/styles/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<!-- Header section with navigation and language switcher -->
<header class="navbar">
  <a href="#home" class="logo"><img src="public/assets/images/doofplus-logo.png" alt="DoofPlus" class="logo-img"></a>
  <nav class="nav-links" aria-label="Main">
    <a href="#home" data-i18n="nav.home">Home</a>
    <a href="#features" data-i18n="nav.features">Features</a>
    <a href="#benefits" data-i18n="nav.benefits">Benefits</a>
    <a href="#plans" data-i18n="nav.plans">Plans</a>
    <a href="#about" data-i18n="nav.about">About Us</a>
  </nav>
  <div class="nav-actions">
    <div class="lang-switch">
      <button class="lang-btn active" data-lang="en">EN</button>
      <span class="separator">|</span>
      <button class="lang-btn" data-lang="es">ES</button>
    </div>
    <button class="btn btn-teal" data-i18n="nav.qa_access"></button>
    <button class="btn btn-teal" data-i18n="nav.prod_access"></button>
  </div>
</header>

<main>
  <section class="hero" id="home">
    <div class="hero-content">
      <span class="overline" data-i18n="hero.overline"></span>

      <!-- TODO: Implement dynamic content -->

      <h1 data-i18n="hero.title"></h1>
      <p class="subtitle" data-i18n="hero.subtitle"></p>

      <div class="hero-buttons">
        <button class="btn-teal-large" data-i18n="hero.btn_signin"></button>
        <button class="btn-outline" data-i18n="hero.btn_capabilities"></button>
      </div>

      <p class="hero-footer" data-i18n="hero.footer"></p>
    </div>

    <div class="hero-visual">
      <div class="image-wrapper">
        <img src="public/assets/images/pharmaceutical-laboratory.jpg" alt="Pharmaceutical Laboratory" class="main-img">

        <div class="floating-card">
          <span class="status-badge" data-i18n="hero.badge"></span>
          <p data-i18n="hero.badge_text"></p>
        </div>
      </div>
    </div>
  </section>



<section class="section section-mint" id="workspace">
    <div class="container">
      <span class="overline" data-i18n="workspace.overline">Get started</span>
      <h2 data-i18n="workspace.title">Choose your workspace</h2>
      <p class="section-subtitle" data-i18n="workspace.subtitle"></p>

      <div class="grid-2">
        <article class="segment-card">
          <span class="pill" data-i18n="workspace.qa_tag">QA / QC</span>
          <h3 data-i18n="workspace.qa_title">For QA/QC Specialists</h3>
          <p data-i18n="workspace.qa_text"></p>
          <a href="#" data-magnetic class="btn btn-primary" data-app-segment="qa" data-i18n="workspace.qa_cta">Sign in to the QA/QC environment →</a>
        </article>
        <article class="segment-card">
          <span class="pill" data-i18n="workspace.prod_tag">Production</span>
          <h3 data-i18n="workspace.prod_title">For Production Supervisors</h3>
          <p data-i18n="workspace.prod_text"></p>
          <a href="#" data-magnetic class="btn btn-primary" data-app-segment="production" data-i18n="workspace.prod_cta">Sign in to the Production environment →</a>
        </article>
      </div>

      <div class="new-banner">
        <div>
          <h3 data-i18n="workspace.new_title">New to DoofPlus?</h3>
          <p data-i18n="workspace.new_text"></p>
        </div>
        <div class="new-banner-actions">
          <a href="#" data-magnetic class="btn btn-primary" data-app-segment="register" data-i18n="workspace.register">Register your laboratory</a>
          <a href="#contact" class="btn btn-outline" data-i18n="workspace.contact">Contact us</a>
        </div>
      </div>
    </div>
  </section>

</main>

<script src="public/assets/scripts/translations/en.js"></script>
<script src="public/assets/scripts/translations/es.js"></script>
<script src="public/assets/scripts/main.js"></script>
</body>
</html>
