<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Meta tags for responsive design and character encoding -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Terms of Service of DoofPlus, the pharmaceutical quality-management platform by IngesCompanyCC.">
  <title>Terms of Service - DoofPlus</title>
  <link rel="stylesheet" href="public/assets/styles/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="page-simple">
<!-- Header section with back link and language switcher -->
<header class="navbar">
  <div class="brand-group">
    <a href="index.html" class="logo"><img src="public/assets/images/doofplus-logo.png" alt="DoofPlus" class="logo-img"></a>
    <a href="index.html" class="link-teal" data-i18n="nav.back">← Back to DoofPlus</a>
  </div>
  <div class="lang-switch">
    <button class="lang-btn active" data-lang="en">EN</button>
    <span class="separator">|</span>
    <button class="lang-btn" data-lang="es">ES</button>
  </div>
</header>

<main class="simple-main">
  <article class="container legal">
    <span class="overline" data-i18n="legal.overline">Legal</span>
    <h1 data-i18n="legal.terms_title">Terms of Service</h1>
    <span class="pill" data-i18n="legal.updated"></span>
    <p data-i18n="legal.terms_intro"></p>
    <h2 data-i18n="legal.t1_title"></h2><p data-i18n="legal.t1_text"></p>
    <h2 data-i18n="legal.t2_title"></h2><p data-i18n="legal.t2_text"></p>
    <h2 data-i18n="legal.t3_title"></h2><p data-i18n="legal.t3_text"></p>
    <h2 data-i18n="legal.t4_title"></h2><p data-i18n="legal.t4_text"></p>
    <h2 data-i18n="legal.t5_title"></h2><p data-i18n="legal.t5_text"></p>
    <h2 data-i18n="legal.t6_title"></h2><p data-i18n="legal.t6_text"></p>
  </article>
</main>

<footer class="footer footer-simple">
  <div class="container footer-bottom">
    <p data-i18n="footer.copyright"></p>
    <div class="footer-legal">
      <a href="terms.html" data-i18n="footer.terms"></a>
      <a href="privacy.html" data-i18n="footer.privacy"></a>
    </div>
  </div>
</footer>

<script src="public/assets/scripts/translations/en.js"></script>
<script src="public/assets/scripts/translations/es.js"></script>
<script src="public/assets/scripts/main.js"></script>
</body>
</html>
